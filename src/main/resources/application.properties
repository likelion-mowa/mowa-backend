spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mowa}

jwt.secret=${JWT_SECRET:local-dev-only-secret-change-in-production-min-32-bytes}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
